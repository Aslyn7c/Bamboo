<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lala Lab — 建筑 · 艺术 · 游戏</title>
<style>
/* ================================================================
   Lala Lab — 个人作品集网站
   风格参考：GOA（图像网格 / 全屏搜索 / 双语）× 家琨建筑（留白 / 文人气）
   ================================================================ */
:root{
  --bg:#ffffff;
  --ink:#141414;
  --ink-2:#6f6f6f;
  --ink-3:#a8a8a8;
  --line:#e6e3de;
  --wash:#f5f3f0;
  --accent:#9a3b26;            /* 朱砂色，仅极少量使用 */
  --font-sans:"Helvetica Neue","Segoe UI",Helvetica,Arial,"PingFang SC","Hiragino Sans GB","Source Han Sans SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  --font-display:"Helvetica Neue","Segoe UI",Helvetica,Arial,"PingFang SC","Hiragino Sans GB","Source Han Sans SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  /* 英文标注层：等宽字体（图纸注记感），中文回落到黑体，绝不回落宋体 */
  --font-mono:"SFMono-Regular","SF Mono",ui-monospace,Consolas,"Roboto Mono",Menlo,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",monospace;
  --maxw:1280px;
  --pad:clamp(20px,4vw,56px);
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  background:var(--bg);color:var(--ink);
  font-family:var(--font-sans);
  font-size:15px;line-height:1.75;
  -webkit-font-smoothing:antialiased;
}
img{display:block;max-width:100%;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;background:none;border:none;cursor:pointer;color:inherit;}
::selection{background:#141414;color:#fff;}

/* ---------- 顶栏 ---------- */
header{
  position:fixed;top:0;left:0;right:0;z-index:100;
  background:rgba(255,255,255,.92);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  transition:background .4s ease,border-color .4s ease;
}
/* 首页顶部：顶栏透明悬浮在整屏大图上 */
body.hero-top header{
  background:transparent;border-bottom-color:transparent;
  backdrop-filter:none;-webkit-backdrop-filter:none;
}
body.hero-top .wordmark{color:#fff;}
body.hero-top .wordmark .zh{color:rgba(255,255,255,.72);}
body.hero-top nav .nav-link{color:rgba(255,255,255,.82);}
body.hero-top nav .nav-link:hover,body.hero-top nav .nav-link.active{color:#fff;}
body.hero-top nav .nav-link::after{background:#fff;}
body.hero-top .icon-btn{color:rgba(255,255,255,.88);}
body.hero-top .icon-btn:hover{color:#fff;}
body.hero-top .lang-opt{color:rgba(255,255,255,.6);}
body.hero-top .lang-opt.on,body.hero-top .lang-opt:hover{color:#fff;}
body.hero-top .lang-sep{color:rgba(255,255,255,.35);}
body.hero-top .burger span{background:#fff;}
body.mobile-open header{background:rgba(255,255,255,.96);border-bottom-color:var(--line);}
body.mobile-open .wordmark{color:var(--ink);}
body.mobile-open .wordmark .zh{color:var(--ink-2);}
body.mobile-open .icon-btn{color:var(--ink-2);}
body.mobile-open .lang-opt{color:var(--ink-3);}
body.mobile-open .lang-opt.on{color:var(--ink);}
body.mobile-open .lang-sep{color:var(--line);}
body.mobile-open .burger span{background:var(--ink);}
.header-inner{
  max-width:var(--maxw);margin:0 auto;padding:0 var(--pad);
  height:72px;display:flex;align-items:center;justify-content:space-between;gap:24px;
}
.wordmark{display:flex;flex-direction:column;line-height:1.25;}
.wordmark .en{
  font-family:var(--font-mono);font-size:17px;font-weight:300;letter-spacing:.2em;
  text-transform:uppercase;white-space:nowrap;
}
.wordmark .zh{font-size:10.5px;letter-spacing:.46em;color:var(--ink-2);white-space:nowrap;margin-top:2px;}
nav{display:flex;align-items:center;gap:clamp(10px,1.8vw,26px);height:72px;}
.nav-item{position:relative;display:flex;align-items:center;height:72px;}
nav .nav-link{
  font-size:13.5px;letter-spacing:.12em;color:var(--ink-2);
  padding:6px 0;position:relative;white-space:nowrap;transition:color .25s,background .25s;
}
/* 「关于」下拉：悬停仅弹出菜单；父项本身不导航、无底色，与相邻栏目等间距 */
.nav-item.has-sub > .nav-link{
  display:flex;align-items:center;gap:6px;padding:6px 0;
  background:none;border:none;cursor:pointer;
}
.nav-item.has-sub > .nav-link .caret{transition:transform .3s;opacity:.7;}
.nav-item.has-sub:hover > .nav-link{color:var(--ink);}
.nav-item.has-sub:hover > .nav-link .caret,
.nav-item.has-sub.open > .nav-link .caret{transform:rotate(180deg);}
.sub-menu{
  position:absolute;top:72px;left:-26px;min-width:160px;
  background:#fff;border:1px solid var(--line);border-top:none;
  padding:8px 0;display:none;z-index:120;
}
.nav-item.has-sub:hover .sub-menu,
.nav-item.has-sub:focus-within .sub-menu,
.nav-item.has-sub.open .sub-menu{display:block;}
.sub-menu a{
  display:block;padding:14px 24px;font-size:13.5px;letter-spacing:.1em;
  color:var(--ink-2);transition:.2s;white-space:nowrap;
}
.sub-menu a:hover{color:var(--ink);background:var(--wash);}
nav .nav-link::after{
  content:"";position:absolute;left:0;bottom:0;height:1px;width:0;
  background:var(--ink);transition:width .3s ease;
}
nav .nav-link:hover{color:var(--ink);}
nav .nav-link.active{color:var(--ink);}
nav .nav-link.active::after,nav .nav-link:hover::after{width:100%;}
.nav-tools{display:flex;align-items:center;gap:18px;margin-left:6px;}
.icon-btn{display:flex;align-items:center;justify-content:center;padding:4px;color:var(--ink-2);transition:color .25s;}
.icon-btn:hover{color:var(--ink);}
/* 中英文切换：与导航同字体同字号，仿参考图「中文 | ENGLISH」 */
.lang-switch{display:flex;align-items:center;gap:12px;}
.lang-opt{font-size:13.5px;letter-spacing:.12em;color:var(--ink-3);padding:4px 0;transition:color .25s;white-space:nowrap;}
.lang-opt:hover{color:var(--ink);}
.lang-opt.on{color:var(--ink);}
.lang-sep{color:var(--line);font-size:13px;}
.burger{display:none;}

/* ---------- 移动端菜单 ---------- */
@media (max-width:880px){
  .wordmark .en{font-size:15px;letter-spacing:.16em;}
  .wordmark .zh{letter-spacing:.3em;font-size:9.5px;}
  nav .nav-item{display:none;}
  .lang-opt{font-size:12px;}
  .burger{display:flex;flex-direction:column;gap:5px;padding:6px;}
  .burger span{display:block;width:22px;height:1px;background:var(--ink);transition:.3s;}
  .mobile-open .burger span:nth-child(1){transform:translateY(6px) rotate(45deg);}
  .mobile-open .burger span:nth-child(2){opacity:0;}
  .mobile-open .burger span:nth-child(3){transform:translateY(-6px) rotate(-45deg);}
}
.mobile-menu{
  position:fixed;inset:72px 0 0 0;background:#fff;z-index:99;
  display:none;flex-direction:column;padding:8vh var(--pad);gap:4px;
}
.mobile-open .mobile-menu{display:flex;}
.mobile-menu a{
  font-family:var(--font-display);font-weight:300;font-size:24px;letter-spacing:.12em;padding:14px 0;
  border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;
}
.mobile-menu a small{font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;color:var(--ink-3);text-transform:uppercase;}
.mobile-menu a.mm-sub{font-size:16px;font-weight:400;padding:11px 0 11px 22px;color:var(--ink-2);border-bottom:1px solid var(--wash);}
.mobile-menu .mm-head{
  font-family:var(--font-display);font-weight:300;font-size:24px;letter-spacing:.12em;
  padding:14px 0;border-bottom:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:baseline;color:var(--ink);
}
.mobile-menu .mm-head small{font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;color:var(--ink-3);text-transform:uppercase;}
@media (max-width:430px){.wordmark .zh{display:none;}.header-inner{gap:12px;}}

/* ---------- 版面容器 ---------- */
main{padding-top:72px;min-height:calc(100vh - 220px);}
body.route-home main{padding-top:0;}
.container{max-width:var(--maxw);margin:0 auto;padding:0 var(--pad);}
.page{animation:fadein .5s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

/* ---------- 页面标题 ---------- */
.page-head{padding:clamp(40px,7vh,84px) 0 30px;border-bottom:1px solid var(--line);margin-bottom:44px;}
.page-head h1{font-family:var(--font-display);font-size:clamp(28px,3.6vw,42px);font-weight:200;letter-spacing:.16em;}
.page-head .sub{margin-top:8px;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);}
.page-head .desc{margin-top:18px;max-width:640px;color:var(--ink-2);font-size:14px;}

/* ---------- 首页 Hero ---------- */
.hero{position:relative;height:100vh;min-height:520px;overflow:hidden;background:#0f0f0f;}
.hero-slide{position:absolute;inset:0;opacity:0;transition:opacity 1.4s ease;pointer-events:none;}
.hero-slide.on{opacity:1;pointer-events:auto;}
.hero-slide .ph,.hero-slide img{width:100%;height:100%;object-fit:cover;}
.hero-veil{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.34) 0%,rgba(0,0,0,0) 20%),linear-gradient(to top,rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 45%);}
.hero-cap{
  position:absolute;left:0;right:0;bottom:0;color:#fff;
  padding:0 var(--pad) clamp(30px,6vh,64px);
  max-width:var(--maxw);margin:0 auto;
}
.hero-cap .cat{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;opacity:.8;}
.hero-cap h2{font-family:var(--font-display);font-weight:200;font-size:clamp(26px,4vw,46px);letter-spacing:.14em;margin-top:10px;}
.hero-cap .en-t{font-family:var(--font-mono);font-size:11px;letter-spacing:.16em;opacity:.8;margin-top:8px;text-transform:uppercase;}
.hero-dots{position:absolute;right:var(--pad);bottom:34px;display:flex;gap:10px;z-index:5;}
.hero-dots button{width:26px;height:2px;background:rgba(255,255,255,.35);transition:background .3s;}
.hero-dots button.on{background:#fff;}
.hero-scroll{
  position:absolute;left:50%;bottom:18px;transform:translateX(-50%);
  color:#fff;opacity:.7;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;
  animation:bob 2.4s ease-in-out infinite;
}
@keyframes bob{0%,100%{transform:translate(-50%,0);}50%{transform:translate(-50%,6px);}}

/* ---------- 首页分区 ---------- */
.home-sec{padding:clamp(50px,9vh,110px) 0 0;}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:34px;}
.sec-head h3{font-family:var(--font-display);font-size:clamp(20px,2.4vw,28px);font-weight:300;letter-spacing:.16em;}
.sec-head .more{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);transition:color .25s;}
.sec-head .more:hover{color:var(--accent);}
.intro-block{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:clamp(28px,5vw,80px);align-items:start;}
.intro-block .lede{font-family:var(--font-display);font-weight:300;font-size:clamp(19px,2.1vw,25px);line-height:2;letter-spacing:.08em;}
.intro-block .body{color:var(--ink-2);font-size:14.5px;}
.intro-block .body p+p{margin-top:14px;}
@media (max-width:760px){.intro-block{grid-template-columns:1fr;}}

/* ---------- 项目网格（GOA 式） ---------- */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:26px 22px;}
@media (max-width:960px){.grid{grid-template-columns:repeat(2,1fr);}}
@media (max-width:560px){.grid{grid-template-columns:1fr;}}
.card{display:block;}
.card .thumb{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--wash);}
.card .thumb .ph,.card .thumb img{width:100%;height:100%;object-fit:cover;transition:transform .8s ease,filter .5s ease;}
.card:hover .thumb .ph,.card:hover .thumb img{transform:scale(1.045);}
.card .thumb .veil{
  position:absolute;inset:0;background:rgba(15,15,15,0);transition:background .4s;
  display:flex;align-items:flex-end;padding:18px;
}
.card:hover .thumb .veil{background:rgba(15,15,15,.34);}
.card .thumb .veil span{
  color:#fff;font-size:12px;letter-spacing:.3em;text-transform:uppercase;
  opacity:0;transform:translateY(8px);transition:.4s;
}
.card:hover .thumb .veil span{opacity:1;transform:none;}
.card .meta{padding:12px 2px 0;}
.card .meta .t{font-size:15.5px;letter-spacing:.05em;}
.card .meta .s{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3);letter-spacing:.08em;margin-top:5px;text-transform:uppercase;}

/* ---------- 分类筛选 ---------- */
.filters{display:flex;flex-wrap:wrap;gap:6px 26px;margin-bottom:38px;}
.filters button{
  font-size:13.5px;letter-spacing:.12em;color:var(--ink-2);
  padding:4px 0;border-bottom:1px solid transparent;transition:.25s;
}
.filters button:hover{color:var(--ink);}
.filters button.on{color:var(--ink);border-bottom-color:var(--ink);}

/* ---------- 项目详情 ---------- */
.detail-hero{margin:0 0 40px;position:relative;aspect-ratio:21/9;min-height:280px;overflow:hidden;background:var(--wash);}
.detail-hero .ph,.detail-hero img{width:100%;height:100%;object-fit:cover;}
.detail-grid{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:clamp(28px,5vw,80px);}
@media (max-width:760px){.detail-grid{grid-template-columns:1fr;}}
.spec{font-size:13px;}
.spec dl{display:grid;grid-template-columns:auto 1fr;gap:10px 18px;}
.spec dt{font-family:var(--font-mono);color:var(--ink-3);letter-spacing:.1em;text-transform:uppercase;font-size:10px;padding-top:3px;white-space:nowrap;}
.spec dd{color:var(--ink);letter-spacing:.04em;}
.detail-body{color:var(--ink-2);font-size:15px;max-width:680px;}
.detail-body p+p{margin-top:16px;}
.detail-title h1{font-family:var(--font-display);font-size:clamp(26px,3.4vw,40px);font-weight:200;letter-spacing:.14em;}
.detail-title .en-t{font-size:12.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-3);margin-top:8px;}
.detail-title{padding:clamp(36px,6vh,64px) 0 26px;}
.gallery{display:grid;gap:22px;margin:52px 0 0;}
.gallery .g-item{aspect-ratio:16/9;overflow:hidden;background:var(--wash);}
.gallery .g-item.tall{aspect-ratio:4/3;}
.gallery .g-item .ph,.gallery .g-item img{width:100%;height:100%;object-fit:cover;}
.gallery-2{grid-template-columns:1fr 1fr;}
@media (max-width:640px){.gallery-2{grid-template-columns:1fr;}}
.back-link{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin:46px 0 0;transition:color .25s;}
.back-link:hover{color:var(--accent);}
.next-prev{display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:56px;padding:26px 0 0;gap:20px;}
.next-prev a{font-size:13.5px;color:var(--ink-2);letter-spacing:.06em;max-width:45%;transition:color .25s;}
.next-prev a:hover{color:var(--ink);}
.next-prev .lab{display:block;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px;}

/* ---------- 摄影 ---------- */
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
@media (max-width:960px){.photo-grid{grid-template-columns:repeat(2,1fr);}}
@media (max-width:560px){.photo-grid{grid-template-columns:1fr;}}
.photo-item{cursor:zoom-in;}
.photo-item .thumb{aspect-ratio:1/1;overflow:hidden;background:var(--wash);position:relative;}
.play-badge{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;}
.play-badge span{
  width:50px;height:50px;border:1px solid rgba(255,255,255,.85);border-radius:50%;
  display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.22);
}
.play-badge svg{margin-left:3px;}
.photo-item:nth-child(4n+1) .thumb{aspect-ratio:4/5;}
.photo-item:nth-child(4n+3) .thumb{aspect-ratio:5/4;}
.photo-item .thumb .ph,.photo-item .thumb img{width:100%;height:100%;object-fit:cover;transition:transform .8s;}
.photo-item:hover .thumb .ph,.photo-item:hover .thumb img{transform:scale(1.04);}
.photo-item .cap{font-size:12.5px;color:var(--ink-2);margin-top:9px;letter-spacing:.06em;}

/* ---------- 随笔（博客列表与文章页） ---------- */
.essay-list{border-top:1px solid var(--line);}
.essay-item{
  display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px 38px;
  padding:36px 2px;border-bottom:1px solid var(--line);align-items:start;
}
@media (max-width:640px){.essay-item{grid-template-columns:1fr;gap:8px;padding:28px 2px;}}
.essay-item .date{font-family:var(--font-mono);font-size:11px;color:var(--ink-3);letter-spacing:.08em;padding-top:9px;}
.essay-item .e-title{
  display:block;font-family:var(--font-display);font-weight:300;
  font-size:clamp(19px,2.2vw,25px);letter-spacing:.1em;line-height:1.6;transition:color .25s;
}
.essay-item:hover .e-title{color:var(--accent);}
.essay-item .e-ex{
  color:var(--ink-2);font-size:14px;margin-top:10px;max-width:640px;line-height:1.9;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.essay-article{max-width:720px;margin:0 auto;padding-top:clamp(28px,5vh,56px);}
.essay-meta{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3);letter-spacing:.12em;text-transform:uppercase;display:flex;gap:20px;}
.essay-article h1{
  font-family:var(--font-display);font-weight:200;
  font-size:clamp(26px,3.4vw,38px);letter-spacing:.12em;line-height:1.7;margin:16px 0 6px;
}
.essay-sub{font-family:var(--font-mono);font-size:11px;color:var(--ink-3);letter-spacing:.14em;text-transform:uppercase;}
.essay-body{margin-top:38px;color:#3c3c3c;font-size:15.5px;line-height:2.15;letter-spacing:.02em;}
.essay-body p{margin:0 0 1.7em;}
.essay-body p:first-child{font-size:17px;color:var(--ink);}
.essay-fig{margin:44px 0;}
.essay-fig .fig-img{aspect-ratio:16/9;overflow:hidden;background:var(--wash);}
.essay-fig .fig-img .ph,.essay-fig .fig-img img{width:100%;height:100%;object-fit:cover;}
.essay-fig figcaption{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3);letter-spacing:.08em;margin-top:12px;}

/* ---------- 灯箱 ---------- */
.lightbox{
  position:fixed;inset:0;z-index:300;background:rgba(12,12,12,.94);
  display:none;align-items:center;justify-content:center;padding:6vh 6vw;
}
.lightbox.open{display:flex;}
.lightbox .lb-img{max-width:100%;max-height:82vh;}
.lightbox .lb-img .ph{width:min(80vw,1000px);height:min(70vh,700px);}
.lightbox .lb-cap{position:absolute;bottom:3vh;left:8vw;right:8vw;text-align:center;color:#bbb;font-size:12.5px;letter-spacing:.14em;}
.lightbox .lb-desc{margin-top:9px;font-size:12px;color:#8b8b8b;line-height:1.9;letter-spacing:.06em;white-space:pre-line;}
.lightbox .lb-x{position:absolute;top:26px;right:32px;color:#fff;font-size:26px;font-weight:200;}

/* ---------- 荣誉 / 发表（家琨式文字列表） ---------- */
.list-rows{border-top:1px solid var(--line);}
.row{
  display:grid;grid-template-columns:86px minmax(0,1fr) auto;gap:18px;
  padding:20px 2px;border-bottom:1px solid var(--line);align-items:baseline;
}
.row .yr{font-family:var(--font-mono);font-size:12.5px;color:var(--ink-3);letter-spacing:.06em;}
.row .t{font-size:15px;letter-spacing:.04em;}
.row .t small{display:block;font-size:12px;color:var(--ink-3);letter-spacing:.1em;margin-top:3px;}
.row .tag{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap;}
.row a.t:hover{color:var(--accent);}
@media (max-width:560px){.row{grid-template-columns:64px 1fr;}.row .tag{display:none;}}
.sub-sec{margin-bottom:64px;}
.sub-sec h2{font-family:var(--font-display);font-size:22px;font-weight:300;letter-spacing:.18em;margin-bottom:6px;}

/* ---------- 占位图生成（按类别配色，基于 id 的确定性构图） ---------- */
const PH_PALETTES = {
  "architecture":["#b8b1a6","#8e877c","#6e675d"],
  "public-art":["#a7b0b8","#7e8892","#5d6771"],
  "furniture":["#bda98f","#96826a","#75634e"],
  "game":["#9598a3","#63676f","#43464e"],
  "photo":["#c3bfb8","#98938b","#726d64"],
  "person":["#b5aca1","#877e73","#645c52"]
};
function hashStr(s){let h=5381;for(let i=0;i<s.length;i++){h=((h<<5)+h+s.charCodeAt(i))>>>0;}return h;}
function phDataURI(seed, kind, label){
  const pal = PH_PALETTES[kind] || PH_PALETTES["architecture"];
  const h = hashStr(seed);
  const r = n => ((h >> (n*3)) % 97) / 97;   // 0~1 伪随机
  let shapes = "";
  for(let i=0;i<5;i++){
    const x=Math.round(r(i)*760), y=Math.round(r(i+5)*420),
          w=Math.round(60+r(i+2)*380), hh=Math.round(40+r(i+7)*300),
          o=(0.05+r(i+3)*0.12).toFixed(3),
          fill=i%2?"#ffffff":"#000000";
    shapes += `<rect x="${x}" y="${y}" width="${w}" height="${hh}" fill="${fill}" opacity="${o}"/>`;
  }
  const lx=Math.round(r(11)*700), ly=Math.round(r(12)*460);
  shapes += `<line x1="${lx}" y1="0" x2="${lx}" y2="600" stroke="#ffffff" stroke-width="1" opacity="0.18"/>`;
  shapes += `<line x1="0" y1="${ly}" x2="900" y2="${ly}" stroke="#ffffff" stroke-width="1" opacity="0.14"/>`;
  const svg =
`<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="${pal[0]}"/><stop offset="0.55" stop-color="${pal[1]}"/><stop offset="1" stop-color="${pal[2]}"/>
</linearGradient></defs>
<rect width="900" height="600" fill="url(#g)"/>${shapes}
<text x="450" y="306" text-anchor="middle" font-family="Helvetica Neue,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-weight="300" font-size="30" letter-spacing="6" fill="#ffffff" opacity="0.8">${esc(label||"")}</text>
<text x="450" y="560" text-anchor="middle" font-family="Consolas,Menlo,PingFang SC,Microsoft YaHei,monospace" font-size="12" letter-spacing="3" fill="#ffffff" opacity="0.45">PLACEHOLDER 占位图</text>
</svg>`;
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
}
function phBg(seed, kind, label){
  return `<div class="ph" style="background-image:url('${phDataURI(seed,kind,label)}')"></div>`;
}
function imgOrPh(src, seed, kind, label, alt){
  return src ? `<img src="${esc(src)}" alt="${esc(alt||label||"")}" loading="lazy">` : phBg(seed, kind, label);
}

/* ---------- 搜索 ---------- */
function searchIndex(){
  const ix = [];
  PROJECTS.forEach(p=>ix.push({
    type:"project", href:"#/project/"+p.id,
    label:t(p.title), right:`${catName(p.cat)} · ${p.year}`,
    hay:[p.title.zh,p.title.en,p.location.zh,p.location.en,p.year,p.tags,catById(p.cat).zh,catById(p.cat).en,p.cat,p.status.zh,p.status.en,p.desc.zh,p.desc.en].join(" ").toLowerCase()
  }));
  PHOTOS.forEach(ph=>ix.push({
    type:"photo", href:"#/photography",
    label:t(ph.title), right:`${t(ph.place)} · ${ph.year}`,
    hay:[ph.title.zh,ph.title.en,ph.place.zh,ph.place.en,ph.year,(ph.desc?ph.desc.zh+" "+ph.desc.en:""),(ph.type==="video"?"视频 video":"")].join(" ").toLowerCase()
  }));
  ESSAYS.forEach(e=>ix.push({
    type:"essay", href:"#/essay/"+e.id,
    label:t(e.title), right:e.date,
    hay:[e.title.zh,e.title.en,e.excerpt.zh,e.excerpt.en,e.body.zh,e.body.en,e.tags,e.date].join(" ").toLowerCase()
  }));
  AWARDS.forEach(a=>ix.push({
    type:"award", href:"#/recognition",
    label:t(a.title), right:a.year,
    hay:[a.title.zh,a.title.en,a.year,t(a.tag)].join(" ").toLowerCase()
  }));
  PRESS.forEach(p=>ix.push({
    type:"press", href:"#/recognition",
    label:`${t(p.media)} · ${t(p.title)}`, right:p.year,
    hay:[t(p.media),p.title.zh,p.title.en,p.year,t(p.tag)].join(" ").toLowerCase()
  }));
  return ix;
}
function highlight(label, q){
  const i = label.toLowerCase().indexOf(q.toLowerCase());
  if(i<0) return esc(label);
  return esc(label.slice(0,i)) + "<mark>" + esc(label.slice(i,i+q.length)) + "</mark>" + esc(label.slice(i+q.length));
}
function runSearch(q){
  const box = $("#searchResults");
  q = q.trim();
  if(!q){ box.innerHTML = ""; return; }
  const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
  const hits = searchIndex().filter(e => terms.every(w => e.hay.includes(w)));
  if(!hits.length){ box.innerHTML = `<div class="sr-empty">${t(UI.searchEmpty)} — “${esc(q)}”</div>`; return; }
  const groups = [
    ["project",UI.srProjects],["photo",UI.srPhotos],["essay",UI.srEssays],["award",UI.srAwards],["press",UI.srPress]
  ];
  box.innerHTML = groups.map(([type,label])=>{
    const g = hits.filter(h=>h.type===type);
    if(!g.length) return "";
    return `<div class="sr-group"><h5>${t(label)} · ${g.length}</h5>
      ${g.map(h=>`<a class="sr-item" href="${h.href}" data-close-search>
        <span>${highlight(h.label, terms[0])}</span><span class="r">${esc(h.right)}</span></a>`).join("")}
    </div>`;
  }).join("");
}
function searchLayerHTML(){
  return `
  <div class="search-layer" id="searchLayer">
    <button class="search-x" id="searchClose" aria-label="close">×</button>
    <div class="search-top">

        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
          <circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/>

function lightboxHTML(){

function openLightbox(i){
  const ph = PHOTOS[i]; if(!ph) return;
  let media;
  if(ph.type === "video"){
    media = ph.video
      ? `<video src="${esc(ph.video)}" controls playsinline style="max-width:88vw;max-height:70vh;background:#000"></video>`
      : `<div style="position:relative">${phBg(ph.id+"-lb","photo",t(ph.title))}${PLAY_BADGE}</div>`;
  } else {
    media = ph.img
      ? `<img src="${esc(ph.img)}" alt="${esc(t(ph.title))}" style="max-width:88vw;max-height:74vh">`
      : phBg(ph.id+"-lb","photo",t(ph.title));
  }
  $("#lbImg").innerHTML = media;
  let cap = `${esc(t(ph.title))} · ${esc(t(ph.place))} · ${ph.year}`;
  if(ph.desc) cap += `<div class="lb-desc">${esc(t(ph.desc))}</div>`;
  else if(ph.type==="video" && !ph.video) cap += `<div class="lb-desc">${t(UI.videoPh)}</div>`;
  $("#lbCap").innerHTML = cap;
  $("#lightbox").classList.add("open");
  document.body.style.overflow="hidden";
}
function closeLightbox(){
  $("#lightbox").classList.remove("open");
  document.body.style.overflow="";
}

/* ---------- 路由与渲染 ---------- */
function route(){
  const h = location.hash.replace(/^#\/?/,"");
  const seg = h.split("/").filter(Boolean);
  if(seg[0]==="projects") return {page:"projects", cat:seg[1]||""};
  if(seg[0]==="project" && seg[1]) return {page:"project", id:seg[1]};
  if(seg[0]==="photography") return {page:"photography", tab:(seg[1]==="essays"?"essays":"images")};
  if(seg[0]==="essay" && seg[1]) return {page:"essay", id:seg[1]};
  if(seg[0]==="recognition") return {page:"recognition"};
  if(seg[0]==="about") return {page:"about", anchor:seg[1]||""};
  if(seg[0]==="contact") return {page:"contact"};
  return {page:"home"};
}
function render(){
  if(heroTimer){ clearInterval(heroTimer); heroTimer = null; }
  const r = route();
  let inner = "";
  switch(r.page){
    case "projects": inner = pageProjects(r.cat); break;
    case "project": inner = pageProject(r.id); break;
    case "photography": inner = pagePhotography(r.tab); break;
    case "essay": inner = pageEssay(r.id); break;
    case "recognition": inner = pageRecognition(); break;
    case "about": inner = pageAbout(); break;
    case "contact": inner = pageContact(); break;
    default: inner = pageHome();
  }
  $("#app").innerHTML = headerHTML() + `<main>${inner}</main>` + footerHTML() + searchLayerHTML() + lightboxHTML();
  bindEvents(r);
  const titles = {
    home:"", projects:t(UI.nav.projects), project:(projById(r.id)?t(projById(r.id).title):""),
    photography:t(UI.nav.photography), essay:(essayById(r.id)?t(essayById(r.id).title):""),
    recognition:t(UI.nav.recognition),
    about:(lang==="zh"?"简介":"Profile"), contact:t(UI.nav.contact)
  };
  document.title = (titles[r.page]?titles[r.page]+" — ":"") + t(SITE.name) + (lang==="zh"?" | Lala Lab":"");
  window.scrollTo(0,0);
  updateHeaderState();
  if(r.page==="about" && r.anchor){
    const el = document.getElementById("sec-"+r.anchor);
    if(el){ window.scrollTo(0, el.getBoundingClientRect().top + window.scrollY - 86); }
  }
}
function updateHeaderState(){
  const isHome = route().page === "home";
  document.body.classList.toggle("route-home", isHome);
  const onTop = isHome
    && !document.body.classList.contains("mobile-open")
    && window.scrollY < window.innerHeight - 90;
  document.body.classList.toggle("hero-top", onTop);
}
window.addEventListener("scroll", updateHeaderState, {passive:true});
window.addEventListener("resize", updateHeaderState);

function bindEvents(r){
  document.querySelectorAll(".lang-opt").forEach(btn=>{
    btn.onclick = () => {
      if(lang !== btn.dataset.lang){
        lang = btn.dataset.lang;
        document.documentElement.lang = lang;
        render();
      }
    };
  });
  $("#searchBtn").onclick = openSearch;
  $("#searchClose").onclick = closeSearch;
  $("#searchInput").oninput = e => runSearch(e.target.value);
  $("#searchLayer").addEventListener("click", e => { if(e.target.closest("[data-close-search]")) closeSearch(); });
  const aboutToggle = $("#aboutToggle");
  if(aboutToggle){
    aboutToggle.onclick = e => {
      e.preventDefault();
      aboutToggle.closest(".nav-item").classList.toggle("open");
    };
  }
  document.onclick = e => {
    if(!e.target.closest(".nav-item.has-sub")){
      document.querySelectorAll(".nav-item.has-sub.open").forEach(x=>x.classList.remove("open"));
    }
  };
  $("#burgerBtn").onclick = () => { document.body.classList.toggle("mobile-open"); updateHeaderState(); };
  $("#mobileMenu").addEventListener("click", e => { if(e.target.closest("a")){ document.body.classList.remove("mobile-open"); updateHeaderState(); } });
  $("#lbClose").onclick = closeLightbox;
  $("#lightbox").onclick = e => { if(e.target.id==="lightbox") closeLightbox(); };

  document.querySelectorAll(".filters button[data-cat]").forEach(b=>{
    b.onclick = () => { const c=b.dataset.cat; location.hash = c ? "#/projects/"+c : "#/projects"; };
  });
  document.querySelectorAll(".filters button[data-rtab]").forEach(b=>{
    b.onclick = () => { location.hash = b.dataset.rtab==="essays" ? "#/photography/essays" : "#/photography"; };
  });
  document.querySelectorAll("[data-photo]").forEach(el=>{
    el.onclick = () => openLightbox(+el.dataset.photo);
  });

  if(r.page==="home"){
    const slides = document.querySelectorAll(".hero-slide");
    const dots = document.querySelectorAll(".hero-dots button");
    let cur = 0;
    const go = i => {
      cur = (i+slides.length)%slides.length;
      slides.forEach((s,j)=>s.classList.toggle("on", j===cur));
      dots.forEach((d,j)=>d.classList.toggle("on", j===cur));
    };
    dots.forEach(d=>d.onclick = e => { e.preventDefault(); go(+d.dataset.dot); });
    if(slides.length>1) heroTimer = setInterval(()=>go(cur+1), 5200);
  }
}
document.addEventListener("keydown", e=>{
  if(e.key==="Escape"){ closeSearch(); closeLightbox(); document.body.classList.remove("mobile-open"); }
  if(e.key==="/" && !$("#searchLayer").classList.contains("open") && document.activeElement.tagName!=="INPUT"){
    e.preventDefault(); openSearch();
  }
});
window.addEventListener("hashchange", render);
render();
</script>
</body>
</html>
